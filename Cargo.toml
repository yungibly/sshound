[package]
name = "sshound"
version = "0.1.0"
edition = "2024"
description = "Play audio files from a remote shell: waveform in the terminal, sound on your own machine"

[dependencies]
anyhow = "1"
ratatui = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"

[profile.release]
lto = "thin"
strip = true
